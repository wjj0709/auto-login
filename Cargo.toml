[package]
name = "anyrouter-checkin"
version = "0.1.0"
edition = "2021"
description = "AnyRouter auto check-in tool (Rust version)"

[dependencies]
reqwest = { version = "0.12", features = ["cookies", "json", "gzip", "brotli", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
sha2 = "0.10"
chrono = "0.4"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }
